<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="counter">
        <h2>COUNTER</h2>
        <div class="count">
            <span>0</span>
        </div>
        <div class="btns">
            <span class="decrement">-</span>
            <span class="reset">Reset</span>
            <span class="increment">+</span>
        </div>
    </div>
    
    <script src="./main.js"></script>
</body>
</html>
